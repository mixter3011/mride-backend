name: CI/CD for MRIDE Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  GO_VERSION: '1.23'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run gosec security scanner
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          gosec ./...
        continue-on-error: true

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=10m --out-format=colored-line-number

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Compile Check
        run: go build -v ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

      - name: Create test summary
        if: always()
        run: |
          echo "## Test Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Version:** ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "- **Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          fi

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run benchmark tests
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark.txt
          echo "## Performance Benchmarks 🚀" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mride-backend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/mride-backend.tar

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/mride-backend.tar
          retention-days: 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy Docker image to server
        run: |
          scp /tmp/mride-backend.tar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/mride-backend/

      - name: Deploy with Blue-Green Strategy
        timeout-minutes: 15
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          cd ~/mride-backend
          
          # Load environment variables
          if [ ! -f .env ]; then
            echo "[ERROR] .env file not found!"
            exit 1
          fi
          
          echo "[INFO] Starting deployment at $(date)"
          
          # Store current state for rollback
          echo "[STEP] Storing rollback information..."
          git rev-parse HEAD > .last-successful-deploy || echo "main" > .last-successful-deploy
          docker compose -f docker-compose.prod.yml --env-file .env ps --format json > .last-container-state || echo "[]" > .last-container-state
          
          # Pull latest code
          echo "[STEP] Updating code..."
          git fetch origin main
          git reset --hard origin/main
          
          # Load new Docker image
          echo "[STEP] Loading new Docker image..."
          docker load < mride-backend.tar
          docker tag mride-backend:${{ github.sha }} mride-backend:latest
          
          # Database backup before deployment
          echo "[STEP] Creating database backup..."
          docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres pg_dump -U ${DB_USER} ${DB_NAME} > backups/backup-$(date +%Y%m%d-%H%M%S).sql || echo "[WARN] Backup failed"
          
          # Pre-deployment health check
          echo "[STEP] Pre-deployment health check..."
          if ! curl -fsSL --max-time 10 https://mride.senachi.me/health > /dev/null 2>&1; then
            echo "[WARN] Service was already down"
          fi
          
          # Deploy with zero-downtime strategy
          echo "[STEP] Deploying new version..."
          
          # Start new containers alongside old ones (if space permits)
          docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps app
          
          # Wait for new container to be ready
          echo "[STEP] Waiting for new container to be ready..."
          NEW_CONTAINER_ID=$(docker compose -f docker-compose.prod.yml --env-file .env ps -q app)
          
          # Health check with retries
          HEALTH_CHECK_PASSED=false
          for i in {1..12}; do
            echo "[STEP] Health check attempt $i/12..."
            
            # Check if container is still running
            if ! docker ps -q --no-trunc | grep -q "$NEW_CONTAINER_ID"; then
              echo "[ERROR] Container died during startup!"
              docker compose -f docker-compose.prod.yml --env-file .env logs app --tail=50
              break
            fi
            
            # Check health endpoint
            if curl -fsSL --max-time 5 https://mride.senachi.me/health > /dev/null 2>&1; then
              echo "[SUCCESS] Health check passed on attempt $i"
              HEALTH_CHECK_PASSED=true
              break
            fi
            
            if [ $i -lt 12 ]; then
              echo "[RETRY] Health check failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          # Handle deployment result
          if [ "$HEALTH_CHECK_PASSED" = "true" ]; then
            echo "[SUCCESS] Deployment completed successfully at $(date)"
            
            # Cleanup old images (keep last 3)
            echo "[STEP] Cleaning up old Docker images..."
            docker images mride-backend --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" | tail -n +2 | head -n -3 | awk '{print $3}' | xargs -r docker rmi || true
            
            # Remove old backups (keep last 10)
            echo "[STEP] Cleaning up old backups..."
            ls -t backups/backup-*.sql | tail -n +11 | xargs -r rm || true
            
          else
            echo "[ERROR] Health check failed! Initiating rollback..."
            
            # Show logs for debugging
            echo "[DEBUG] Application logs:"
            docker compose -f docker-compose.prod.yml --env-file .env logs app --tail=100
            
            # Rollback
            if [ -f .last-successful-deploy ]; then
              echo "[ROLLBACK] Rolling back to previous version..."
              git reset --hard $(cat .last-successful-deploy)
              docker compose -f docker-compose.prod.yml --env-file .env down
              docker compose -f docker-compose.prod.yml --env-file .env up -d
              
              # Verify rollback
              sleep 15
              if curl -fsSL --max-time 10 https://mride.senachi.me/health > /dev/null 2>&1; then
                echo "[ROLLBACK] Rollback successful"
                exit 1
              else
                echo "[FATAL] Rollback failed! Manual intervention required!"
                exit 2
              fi
            else
              echo "[FATAL] No rollback point available!"
              exit 2
            fi
          fi
          # Show deployment summary
          echo "[INFO] Deployment Summary:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY  
          echo "- **Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          EOF

      - name: Post-deployment verification
        run: |
          # Additional verification steps
          echo "Verifying deployment..."
          
          # Check main health endpoint
          curl -fsSL --max-time 10 https://mride.senachi.me/health
          
          # Check WebSocket endpoint (basic connectivity)
          curl -fsSL --max-time 10 -H "Connection: Upgrade" -H "Upgrade: websocket" https://mride.senachi.me/ws || true

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running smoke tests..."
          
          # Test API endpoints
          HEALTH_STATUS=$(curl -s https://mride.senachi.me/health | jq -r '.status')
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "❌ Health check failed"
            exit 1
          fi
          
          echo "✅ All smoke tests passed"

      - name: Update deployment status
        if: always()
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ~/mride-backend
          echo "{
            \"commit\": \"${{ github.sha }}\",
            \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"status\": \"${{ job.status }}\",
            \"workflow_run\": \"${{ github.run_id }}\"
          }" > .deployment-status.json
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          STATUS_EMOJI="✅"
          STATUS_TEXT="successful"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
          fi
          
          # Send email notification
          python3 << EOF
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os
          
          # Email configuration
          smtp_server = "smtp.gmail.com"
          smtp_port = 587
          sender_email = "${{ secrets.NOTIFICATION_EMAIL }}"
          sender_password = "${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}"
          recipient_email = "senachi0827@gmail.com"
          
          # Create message
          msg = MIMEMultipart()
          msg['From'] = sender_email
          msg['To'] = recipient_email
          msg['Subject'] = f"${STATUS_EMOJI} MRIDE Backend Deployment ${STATUS_TEXT.title()}"
          
          # Email body
          body = f"""
          MRIDE Backend Deployment Report
          
          Status: ${STATUS_EMOJI} {STATUS_TEXT.upper()}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Timestamp: $(date -u)
          
          View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          """
          
          msg.attach(MIMEText(body, 'plain'))
          
          try:
              server = smtplib.SMTP(smtp_server, smtp_port)
              server.starttls()
              server.login(sender_email, sender_password)
              server.send_message(msg)
              server.quit()
              print(f"${STATUS_EMOJI} Deployment ${STATUS_TEXT} - Email sent successfully")
          except Exception as e:
              print(f"Failed to send email: {e}")
          EOF

  monitoring:
    name: Post-Deploy Monitoring
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Monitor application health
        timeout-minutes: 10
        run: |
          echo "Monitoring application for 5 minutes..."
          for i in {1..30}; do
            if ! curl -fsSL --max-time 5 https://mride.senachi.me/health > /dev/null; then
              echo "❌ Health check failed at $(date)"
              exit 1
            fi
            echo "✅ Health check $i/30 passed"
            sleep 10
          done
          echo "✅ Application stable after deployment"

      - name: Performance baseline check
        run: |
          # Simple performance check
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' https://mride.senachi.me/health)
          echo "Response time: ${RESPONSE_TIME}s"
          
          # Alert if response time > 2 seconds
          if (( $(echo "$RESPONSE_TIME > 2.0" | bc -l) )); then
            echo "⚠️  High response time detected: ${RESPONSE_TIME}s"
          fi

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          name: docker-image
        continue-on-error: true