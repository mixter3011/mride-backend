name: CI/CD for MRIDE Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  GO_VERSION: '1.24'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
          POSTGRES_INITDB_ARGS: "--auth-host=md5"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        continue-on-error: true 

      - name: Setup test database
        env:
          PGPASSWORD: testpass
        run: |
          # Wait for PostgreSQL to be ready
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          
          # Create root user if your app expects it
          psql -h localhost -p 5432 -U testuser -d testdb -c "CREATE USER root WITH PASSWORD 'testpass';" || true
          psql -h localhost -p 5432 -U testuser -d testdb -c "GRANT ALL PRIVILEGES ON DATABASE testdb TO root;" || true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2  
          args: --timeout=10m --out-format=colored-line-number
        continue-on-error: true 

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          GITHUB_ACTIONS: "true"
          GORM_LOG_LEVEL: "1"
        run: |
          # Set GORM to silent mode to reduce log output
          export GORM_LOG_LEVEL=1
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || exit 1
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage reports
        if: github.repository_owner == 'mixter3011' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Compile Check
        run: go build -v ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
        continue-on-error: true  

      - name: Create test summary
        if: always()
        run: |
          echo "## Test Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Version:** ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "- **Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          fi

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run benchmark tests
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark.txt || true
          echo "## Performance Benchmarks 🚀" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
        continue-on-error: true
          
      - name: Run Trivy for SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
        continue-on-error: true

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mride-backend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/mride-backend.tar
          build-args: |
            CI_BUILD=true

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/mride-backend.tar
          retention-days: 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy Docker image to server
        run: |
          scp /tmp/mride-backend.tar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/mride-backend/

      - name: Deploy with Blue-Green Strategy
        timeout-minutes: 15
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          cd ~/mride-backend
          
          # Load environment variables
          if [ ! -f .env ]; then
            echo "[ERROR] .env file not found!"
            exit 1
          fi
          
          echo "[INFO] Starting deployment at $(date)"
          
          # Store current state for rollback
          echo "[STEP] Storing rollback information..."
          git rev-parse HEAD > .last-successful-deploy || echo "main" > .last-successful-deploy
          docker compose -f docker-compose.prod.yml --env-file .env ps --format json > .last-container-state || echo "[]" > .last-container-state
          
          # Pull latest code
          echo "[STEP] Updating code..."
          git fetch origin main
          git reset --hard origin/main
          
          # Load new Docker image
          echo "[STEP] Loading new Docker image..."
          docker load < mride-backend.tar
          docker tag mride-backend:${{ github.sha }} mride-backend:latest
          
          # Database backup before deployment
          echo "[STEP] Creating database backup..."
          mkdir -p backups
          docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres pg_dump -U ${DB_USER} ${DB_NAME} > backups/backup-$(date +%Y%m%d-%H%M%S).sql || echo "[WARN] Backup failed"
          
          # Pre-deployment health check
          echo "[STEP] Pre-deployment health check..."
          if ! curl -fsSL --max-time 10 https://mride.senachi.me/health > /dev/null 2>&1; then
            echo "[WARN] Service was already down"
          fi
          
          # Deploy with zero-downtime strategy
          echo "[STEP] Deploying new version..."
          
          # Start new containers alongside old ones (if space permits)
          docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps app
          
          # Wait for new container to be ready
          echo "[STEP] Waiting for new container to be ready..."
          NEW_CONTAINER_ID=$(docker compose -f docker-compose.prod.yml --env-file .env ps -q app)
          
          # Health check with retries
          HEALTH_CHECK_PASSED=false
          for i in {1..12}; do
            echo "[STEP] Health check attempt $i/12..."
            
            # Check if container is still running
            if ! docker ps -q --no-trunc | grep -q "$NEW_CONTAINER_ID"; then
              echo "[ERROR] Container died during startup!"
              docker compose -f docker-compose.prod.yml --env-file .env logs app --tail=50
              break
            fi
            
            # Check health endpoint
            if curl -fsSL --max-time 5 https://mride.senachi.me/health > /dev/null 2>&1; then
              echo "[SUCCESS] Health check passed on attempt $i"
              HEALTH_CHECK_PASSED=true
              break
            fi
            
            if [ $i -lt 12 ]; then
              echo "[RETRY] Health check failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          # Store deployment result for notification
          echo "$HEALTH_CHECK_PASSED" > /tmp/deployment_success
          
          # Handle deployment result
          if [ "$HEALTH_CHECK_PASSED" = "true" ]; then
            echo "[SUCCESS] Deployment completed successfully at $(date)"
            
            # Cleanup old images (keep last 3)
            echo "[STEP] Cleaning up old Docker images..."
            docker images mride-backend --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" | tail -n +2 | head -n -3 | awk '{print $3}' | xargs -r docker rmi || true
            
            # Remove old backups (keep last 10)
            echo "[STEP] Cleaning up old backups..."
            ls -t backups/backup-*.sql 2>/dev/null | tail -n +11 | xargs -r rm || true
            
          else
            echo "[ERROR] Health check failed! Initiating rollback..."
            
            # Show logs for debugging
            echo "[DEBUG] Application logs:"
            docker compose -f docker-compose.prod.yml --env-file .env logs app --tail=100
            
            # Rollback
            if [ -f .last-successful-deploy ]; then
              echo "[ROLLBACK] Rolling back to previous version..."
              git reset --hard $(cat .last-successful-deploy)
              docker compose -f docker-compose.prod.yml --env-file .env down
              docker compose -f docker-compose.prod.yml --env-file .env up -d
              
              # Verify rollback
              sleep 15
              if curl -fsSL --max-time 10 https://mride.senachi.me/health > /dev/null 2>&1; then
                echo "[ROLLBACK] Rollback successful"
                exit 1
              else
                echo "[FATAL] Rollback failed! Manual intervention required!"
                exit 2
              fi
            else
              echo "[FATAL] No rollback point available!"
              exit 2
            fi
          fi
          EOF

      - name: Post-deployment verification
        run: |
          # Additional verification steps
          echo "Verifying deployment..."
          
          # Check main health endpoint
          curl -fsSL --max-time 10 https://mride.senachi.me/health
          
          # Check WebSocket endpoint (basic connectivity)
          curl -fsSL --max-time 10 -H "Connection: Upgrade" -H "Upgrade: websocket" https://mride.senachi.me/ws || true

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running smoke tests..."
          
          # Test API endpoints
          if command -v jq >/dev/null 2>&1; then
            HEALTH_STATUS=$(curl -s https://mride.senachi.me/health | jq -r '.status')
            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ Health check failed"
              exit 1
            fi
          else
            # Fallback without jq
            curl -fsSL --max-time 5 https://mride.senachi.me/health
          fi
          
          echo "✅ All smoke tests passed"

      - name: Update deployment status
        if: always()
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ~/mride-backend
          echo "{
            \"commit\": \"${{ github.sha }}\",
            \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"status\": \"${{ job.status }}\",
            \"workflow_run\": \"${{ github.run_id }}\"
          }" > .deployment-status.json
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          STATUS_EMOJI="✅"
          STATUS_TEXT="successful"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
          fi
          
          # Check if email credentials are available
          if [ -z "${{ secrets.NOTIFICATION_EMAIL }}" ] || [ -z "${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}" ]; then
            echo "⚠️ Email notification skipped - missing NOTIFICATION_EMAIL or NOTIFICATION_EMAIL_PASSWORD secrets"
            exit 0
          fi
          
          # Install mailutils for email sending
          sudo apt-get update && sudo apt-get install -y mailutils ssmtp
          
          # Configure ssmtp for Gmail
          sudo tee /etc/ssmtp/ssmtp.conf > /dev/null << EOF
          root=${{ secrets.NOTIFICATION_EMAIL }}
          mailhub=smtp.gmail.com:587
          AuthUser=${{ secrets.NOTIFICATION_EMAIL }}
          AuthPass=${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}
          UseSTARTTLS=YES
          UseTLS=YES
          FromLineOverride=YES
          EOF
          
          # Set correct permissions
          sudo chmod 640 /etc/ssmtp/ssmtp.conf
          
          # Send email
          {
            echo "Subject: ${STATUS_EMOJI} MRIDE Backend Deployment ${STATUS_TEXT^}"
            echo "From: ${{ secrets.NOTIFICATION_EMAIL }}"
            echo "To: senachi0827@gmail.com"
            echo ""
            echo "MRIDE Backend Deployment Report"
            echo ""
            echo "Status: ${STATUS_EMOJI} ${STATUS_TEXT^^}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Run ID: ${{ github.run_id }}"
            echo "Timestamp: $(date -u)"
            echo ""
            echo "View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ssmtp senachi0827@gmail.com
          
          echo "✅ Email notification sent successfully"

  monitoring:
    name: Post-Deploy Monitoring
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Monitor application health
        timeout-minutes: 10
        run: |
          echo "Monitoring application for 5 minutes..."
          for i in {1..30}; do
            if ! curl -fsSL --max-time 5 https://mride.senachi.me/health > /dev/null; then
              echo "❌ Health check failed at $(date)"
              exit 1
            fi
            echo "✅ Health check $i/30 passed"
            sleep 10
          done
          echo "✅ Application stable after deployment"

      - name: Performance baseline check
        run: |
          # Simple performance check
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' https://mride.senachi.me/health)
          echo "Response time: ${RESPONSE_TIME}s"
          
          # Alert if response time > 2 seconds (using awk instead of bc)
          if [ "$(echo "$RESPONSE_TIME > 2.0" | awk '{print ($1 > $3)}')" -eq 1 ]; then
            echo "⚠️  High response time detected: ${RESPONSE_TIME}s"
          fi

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          name: docker-image
        continue-on-error: true